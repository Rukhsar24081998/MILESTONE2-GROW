# Render Blueprint — free-tier FastAPI backend
# Docs: https://render.com/docs/blueprint-spec
# Free plan: 750 hrs/mo, spins down after ~15m idle (~1m cold start)

services:
  - type: web
    name: milestone2-groww-backend
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: LLM_TEMPERATURE
        value: "0.1"
      - key: LLM_MAX_TOKENS
        value: "300"
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: PYTHON_VERSION
        value: "3.11.9"
